<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
/* 正在播放 · Platinum：和 Agent Deck 同一套铂金色窗口。播放交给后台的音乐 App，这里只画界面。
   省 CPU：没有常驻动画，歌词只在换行时做一次位移过渡；看不见时（onPause）停掉所有定时器。 */
:root{--plat:#e4e2dd;--plat-hi:#f7f6f3;--ink:#1d1c1a;--ink2:#625e57;--sel:#2c56c9;--paper:#f7f5f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Noto Sans SC","Roboto",system-ui,sans-serif;touch-action:manipulation;
 background:radial-gradient(ellipse 80% 70% at 28% 0%,rgba(255,234,210,.32),transparent 70%),linear-gradient(170deg,#5d708e 0%,#7e869a 48%,#ab9e91 100%)}
#app{height:100%;display:flex;flex-direction:column}
.menubar{flex:none;height:28px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:13px;
 background:linear-gradient(#fbfaf8,#e5e3de);border-bottom:1px solid #8f8b84;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.menubar .cat{width:20px;height:20px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.22)}
.menubar b{font-weight:700;letter-spacing:.2px}
.menubar .sp{flex:1}
.menubar .mi{padding:2px 8px;border-radius:3px}
.menubar .mi.down{background:var(--sel);color:#fff}
/* 时间 + 电量：和桌面菜单栏同一套 */
.menubar .when{flex:none;font-variant-numeric:tabular-nums}
.menubar .when span{color:var(--ink2);margin-right:8px}
.batt{flex:none;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.batt .bcell{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:3px;padding:1.5px;position:relative;display:block;flex:none}
.batt .bcell::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--ink);border-radius:0 1px 1px 0}
.batt .bcell i{display:block;height:100%;background:var(--ink);border-radius:1px}
.batt.low{color:#c4331f}.batt.low .bcell{border-color:#c4331f}.batt.low .bcell::after,.batt.low .bcell i{background:#c4331f}
.batt.chg .bcell i{background:#2f9e4a}
.batt svg{width:10px;height:12px;margin-left:-2px}
.win{flex:1;min-height:0;margin:10px 14px 12px;display:flex;flex-direction:column;border:1px solid #4d4a45;border-radius:7px 7px 5px 5px;overflow:hidden;
 background:var(--plat);box-shadow:0 14px 34px rgba(20,24,36,.45),0 2px 6px rgba(0,0,0,.25)}
.title{flex:none;height:24px;display:flex;align-items:center;gap:7px;padding:0 8px;background:linear-gradient(var(--plat-hi),#dbd9d3);border-bottom:1px solid #8f8b84}
.title .stripes{flex:1;height:11px;background:repeating-linear-gradient(180deg,#aaa69f 0 1px,#f8f7f4 1px 2px,transparent 2px 3px)}
.title .box{flex:none;width:12px;height:12px;border:1px solid #57544f;border-radius:2px;background:linear-gradient(135deg,#fff,#c6c3bc);box-shadow:inset 1px 1px 0 #fff}
.title .name{flex:none;font-size:13px;font-weight:700;padding:0 6px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;min-height:0;display:flex;gap:14px;padding:12px 14px}

/* 左：封面 + 信息 + 控制 */
.left{width:46%;flex:none;min-width:0;display:flex;flex-direction:column}
.head{display:flex;gap:14px;min-height:0}
.cover{width:min(170px,40%);aspect-ratio:1;flex:none;border:1px solid #6e6b65;border-radius:4px;background:#cfccc6 center/cover no-repeat;
 box-shadow:inset 0 0 0 3px #f4f2ee,0 2px 6px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;color:#8b877f}
.cover svg{width:40%;height:40%}
.cover.has svg{display:none}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.song{font-size:22px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.artist{font-size:14px;color:var(--ink2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album{font-size:12px;color:var(--ink2);margin-top:2px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-height:8px}
/* 进度条：像老 Mac 的滚动条 */
.prog{height:22px;position:relative;touch-action:none;display:flex;align-items:center}
.track{position:absolute;left:0;right:0;height:10px;border:1px solid #6e6b65;border-radius:5px;background:linear-gradient(#bdb9b2,#d9d6d0);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.fill{position:absolute;left:0;height:10px;border-radius:5px 0 0 5px;background:linear-gradient(#7f9be0,#3d63c9);border:1px solid #2f4f9e;width:0}
.knob{position:absolute;width:18px;height:18px;margin-left:-9px;border-radius:50%;left:0;border:1px solid #57544f;
 background:linear-gradient(#fff,#d4d1ca);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:2px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.b{display:flex;align-items:center;justify-content:center;border:1px solid #7d7972;color:#2c2b28;
 background:linear-gradient(#fdfcfa,#e2dfd9);box-shadow:inset 0 1px 0 #fff,0 2px 0 #a9a59e,0 3px 6px rgba(0,0,0,.12);transition:transform .06s}
.b.down{transform:translateY(2px);background:linear-gradient(#e2dfd9,#d3d0c9);box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.b.side{width:52px;height:52px;border-radius:50%}
.b.side svg{width:24px;height:24px}
.b.main{width:68px;height:68px;border-radius:50%}
.b.main svg{width:32px;height:32px}
.b.pill{height:32px;padding:0 12px;border-radius:8px;font-size:13px;gap:6px}
.b.pill svg{width:16px;height:16px}
.tools{display:flex;gap:8px;justify-content:center;margin-top:12px}

/* 右：纸面。上面唱片机，下面一条歌词（没歌词就显示提示） */
.rpanel{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid #9a968f;border-radius:4px;background:var(--paper);overflow:hidden;
 box-shadow:inset 0 1px 3px rgba(0,0,0,.16)}
.stagebox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.lyr{flex:none;height:76px;position:relative;overflow:hidden}
.lyr::before,.lyr::after{content:"";position:absolute;left:0;right:0;height:16px;z-index:1;pointer-events:none}
.lyr::before{top:0;background:linear-gradient(var(--paper),rgba(247,245,240,0))}
.lyr::after{bottom:0;background:linear-gradient(rgba(247,245,240,0),var(--paper))}
.lines{position:absolute;left:0;right:0;top:0;padding:0 18px;transition:transform .45s ease}
.ln{padding:3px 0;font-size:16px;line-height:1.45;color:#8d897f;text-align:center;font-family:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC",serif}
.ln.on{color:var(--ink);font-size:19px;font-weight:700}
.ln.on span{background:linear-gradient(transparent 62%,rgba(44,86,201,.22) 62%)}
.lmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:15px;text-align:center;padding:20px}
.lmsg small{font-size:12px;opacity:.75}
.status{flex:none;height:22px;display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:var(--ink2);
 background:linear-gradient(#efede9,#d8d5cf);border-top:1px solid #a9a59e}
.status .l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink2);font-size:16px;text-align:center}
/* 唱片机：银色转盘 + 黑胶 + 唱臂。播放时转、唱臂落下；换歌时唱臂抬起 → 旧唱片滑出 → 新唱片滑入 → 唱臂放下 */
.deck{position:relative;width:440px;height:420px;zoom:.66;flex:none;perspective:1000px}
.deck .slot{position:absolute;left:30px;top:40px;width:350px;height:350px;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.5,0,.8,.5),opacity .5s}
/* 拿走：从盘面斜着抬起、往右上飞出 */
.deck .slot.out{transform:translate3d(70%,-55%,140px) rotateX(58deg) rotateZ(-12deg);opacity:0}
/* 新唱片：先悬在左上方斜着，再斜着落到转盘上 */
.deck .slot.in{transform:translate3d(-60%,-50%,150px) rotateX(58deg) rotateZ(10deg);opacity:0;transition:none}
.deck .slot.back{transition:transform .7s cubic-bezier(.2,.8,.3,1),opacity .45s}
.deck .vinyl{position:absolute;inset:0;border-radius:50%;
 background:conic-gradient(from 20deg,rgba(255,255,255,0),rgba(255,255,255,.2) 8%,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 50%,rgba(255,255,255,.2) 58%,rgba(255,255,255,0) 72%),
  repeating-radial-gradient(circle,#2a2927 0 2px,#3b3a37 2px 3px);
 border:1px solid #111;box-shadow:0 0 0 11px #d6d4ce,0 0 0 12px #8f8b84,0 10px 22px rgba(0,0,0,.4);
 animation:vsp 3.6s steps(72) infinite;animation-play-state:paused;will-change:transform}
.deck.spin .vinyl{animation-play-state:running}
@keyframes vsp{to{transform:rotate(360deg)}}
.deck .lab{position:absolute;left:50%;top:50%;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;
 background:#c9c6bf center/cover;border:3px solid #e8e6e1;box-shadow:0 0 0 1px #777}
.deck .lab::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(#fff,#999);box-shadow:0 0 0 1px #555}
.deck .arm{position:absolute;right:26px;top:6px;width:16px;height:300px;transform-origin:50% 22px;transform:rotate(-10deg);
 transition:transform .7s cubic-bezier(.3,.6,.3,1)}
/* 播放时唱针按进度从外沿走到内沿：11°=最外圈，31°=贴纸外最内圈（--arm 由 paintProg 按进度设置） */
.deck.spin .arm{transform:rotate(var(--arm,11deg))}

.deck .arm::before{content:"";position:absolute;left:50%;top:0;width:44px;height:44px;margin-left:-22px;border-radius:50%;
 background:radial-gradient(circle at 40% 35%,#fff,#cfcdc7 55%,#8f8b84);box-shadow:0 0 0 1px #6e6b65,0 3px 6px rgba(0,0,0,.3)}
.deck .arm i{position:absolute;left:50%;top:22px;width:7px;height:250px;margin-left:-3.5px;border-radius:4px;
 background:linear-gradient(90deg,#8f8b84,#f4f3f0 45%,#a9a59e);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.deck .arm b{position:absolute;left:50%;top:262px;width:26px;height:38px;margin-left:-13px;border-radius:4px;
 background:linear-gradient(90deg,#9d9993,#eceae6 50%,#8f8b84);box-shadow:0 2px 4px rgba(0,0,0,.35)}

</style></head>
<body>
<div id="app">
  <div class="menubar">
    <img class="cat" src="mochi.png" alt="">
    <b>正在播放</b>
    <span class="sp"></span>
    <span class="mi" data-k="app">返回 <span id="appName">汽水音乐</span></span>
    <span class="when"><span id="date">--</span><b id="clock">--:--</b></span>
    <span class="batt" id="batt"></span>
  </div>
  <div class="win">
    <div class="title"><i class="box"></i><i class="stripes"></i><span class="name" id="wname">正在播放</span><i class="stripes"></i></div>
    <div class="content" id="content"></div>
    <div class="status"><span class="l" id="stat">—</span><span id="src"></span></div>
  </div>
</div>
<script src="lyric.js"></script>
<script>
const H = window.DuoPlayer, $ = (id) => document.getElementById(id);
const IC = {
  play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',
  pause:'<path d="M8 5v14M16 5v14" stroke-width="3"/>',
  prev:'<path d="M6 5v14"/><path d="M18 5l-9 7 9 7z" fill="currentColor"/>',
  next:'<path d="M18 5v14"/><path d="M6 5l9 7-9 7z" fill="currentColor"/>',
  note:'<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'
};
const svg = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S = { has:false }, lastSec = -1, live = null, liveLast = "", key = null, lines = [], cur = -2, built = false, dragging = false, holdUntil = 0;
const clk = Lyric.clock();
let tPoll = 0, tTick = 0, tBatt = 0;

function buildMain(){
  $("content").innerHTML = `
    <div class="left">
        <div class="head">
          <div class="cover" id="cover">${svg("note")}</div>
          <div class="meta">
            <div class="song" id="song"></div>
            <div class="artist" id="artist"></div>
            <div class="album" id="album"></div>
          </div>
        </div>
        <div class="grow"></div>
        <div class="prog" id="prog"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
        <div class="times"><span id="tpos">0:00</span><span id="tdur">0:00</span></div>
        <div class="ctrl">
          <div class="b side" data-k="prev">${svg("prev")}</div>
          <div class="b main" data-k="playpause" id="pp">${svg("play")}</div>
          <div class="b side" data-k="next">${svg("next")}</div>
        </div>
    </div>
    <div class="rpanel">
      <div class="stagebox"><div class="deck" id="deck"><div class="slot" id="slot"><div class="vinyl"><div class="lab" id="lab"></div></div></div><div class="arm"><i></i><b></b></div></div></div>
      <div class="lyr" id="lyr"><div class="lines" id="lines"></div><div class="lmsg" id="lmsg"></div></div>
    </div>`;
  bindProg(); built = true; key = null;
}
function buildEmpty(){
  built = false; key = null;
  $("content").innerHTML = `<div class="empty">${svg("note").replace("<svg","<svg style='width:56px;height:56px'")}
    <div>还没有音乐 App 在后台放歌</div>
    <div class="b pill" data-k="app">${svg("list")}打开音乐 App 选歌</div>
    <small style="font-size:12px">选好歌、开始播放后，回到桌面再点音乐图标，就会来到这里</small></div>`;
}

function setT(el, v){ if (el && el.textContent !== v) el.textContent = v; }
let hidden = false, ppState = null;
function render(){
  if (!S.has) { if (built || !$("content").firstChild) buildEmpty(); $("stat").textContent = "没有播放器"; return; }
  if (!built) buildMain();
  setT($("appName"), S.label || "音乐 App");
  setT($("wname"), (S.label || "音乐") + " · 正在播放");
  setT($("src"), "播放：" + (S.label || "") + "（后台）");
  if (S.key !== key) {          // 换歌了
    const first = key === null;
    key = S.key;
    if (!first) changeRecord(); lines = []; cur = -2; lastSec = -1;
    $("song").textContent = S.title || "未知歌曲";
    $("artist").textContent = S.artist || "";
    $("album").textContent = S.album || "";
    const a = H.art(), c = $("cover");
    c.style.backgroundImage = a ? `url("${a}")` : ""; c.classList.toggle("has", !!a);
    if (first) $("lab").style.backgroundImage = c.style.backgroundImage;
    const k0 = key; for (const ms of [700, 1600, 3000]) setTimeout(() => { if (key !== k0) return; const a2 = H.art(); if (!a2) return; const u = `url("${a2}")`; if (c.style.backgroundImage !== u) { c.style.backgroundImage = u; c.classList.add("has"); if (!swapping) $("lab").style.backgroundImage = u; } }, ms);
    $("lines").innerHTML = ""; $("lines").style.transform = ""; $("lyr").classList.remove("plain");
    // QQ 音乐开了"车载歌词"：先用它实时给的这句歌词（live），lrclib 查到带时间轴的整篇再换成整篇滚动
    live = S.lyricMode ? [] : null; liveLast = "";
    lmsg(live ? "" : "正在找歌词…");
    if (S.title) H.lyrics(key, S.title, S.artist || "", S.album || "", S.duration || 0);
  }
  if (live && S.line && S.line !== liveLast) liveLine(S.line);
  const want = S.playing ? "pause" : "play";
  if (want !== ppState) { ppState = want; $("pp").innerHTML = svg(want); }   // 重建 SVG 很贵，状态没变就别动
  setT($("tdur"), Lyric.mmss(S.duration));
  setT($("stat"), S.playing ? "播放中" : "已暂停");
  paintSpin();
}
// ---------- 唱片机：换歌动画 ----------
let deckLift = false, liftAt = 0, swapping = false, liftTimer = 0;
let holdPlay = false, wasPlaying = false, holdTimer = 0, lastPause = 0;
// 切歌期间让新歌别出声：有的播放器切歌后会自动开始放，发现在放就再暂停一次
// 上一首/下一首：1 抬臂并暂停 → 2 取走旧唱片 → 3 放上新唱片 → 4 唱臂落下，才开始播放
function step(k){
  if (swapping || holdPlay) return;
  wasPlaying = !!S.playing; holdPlay = true; liftArm(); H.duck(true);
  setTimeout(() => { if (wasPlaying) H.control("pause"); setTimeout(() => { H.control(k); holdUntil = 0; holdTimer = setInterval(holdPoll, 150); }, 150); }, 650);
}
function holdPoll(){ poll();  if (holdPlay && S.playing && Date.now() - lastPause > 350) { lastPause = Date.now(); H.control("pause"); } }
function releasePlay(){ clearInterval(holdTimer); holdTimer = 0; if (holdPlay) { holdPlay = false; H.duck(false); if (wasPlaying) { H.control("seek:0"); H.control("play"); holdUntil = Date.now() + 1200; S.playing = true; render(); } } }
function paintSpin(){ const dk = $("deck"); if (dk) { dk.classList.toggle("spin", !!S.playing && !deckLift && !hidden); dk.classList.toggle("lift", deckLift); } }
function liftArm(){ deckLift = true; liftAt = Date.now(); paintSpin(); clearTimeout(liftTimer); liftTimer = setTimeout(() => { if (!swapping) { deckLift = false; paintSpin(); releasePlay(); } }, 4500); }   // 4 秒没换成歌（比如已经是最后一首）就把唱臂放回去
function changeRecord(){
  if (swapping) return;
  if (!deckLift) liftArm();
  swapping = true;
  const slot = $("slot"), lab = $("lab");
  setTimeout(() => {
    slot.classList.add("out");                       // 旧唱片滑出
    setTimeout(() => {
      lab.style.backgroundImage = $("cover").style.backgroundImage;   // 换上新唱片（封面）
      slot.classList.remove("out"); slot.classList.add("in");         // 瞬间移到左边外面
      void slot.offsetWidth;
      slot.classList.add("back"); slot.classList.remove("in");        // 滑进来
      setTimeout(() => { slot.classList.remove("back"); deckLift = false; swapping = false; paintSpin(); releasePlay(); const l2 = $("lab"); if (l2) l2.style.backgroundImage = $("cover").style.backgroundImage; }, 720);   // 唱臂放下
    }, 560);
  }, Math.max(0, liftAt + 800 - Date.now()));       // 等唱臂抬完
}
function liveLine(t){
  liveLast = t; live.push(t);
  const box = $("lines"), old = box.querySelector(".ln.on"); if (old) old.classList.remove("on");
  box.insertAdjacentHTML("beforeend", `<div class="ln on"><span>${esc(t)}</span></div>`);
  while (box.children.length > 30) box.firstElementChild.remove();
  const el = box.lastElementChild, h = $("lyr").clientHeight;
  box.style.transform = `translateY(${Math.round(h * 0.5 - el.offsetTop - el.offsetHeight / 2)}px)`;
}
function lmsg(t){ const m = $("lmsg"); if (m) { m.innerHTML = t; m.style.display = t ? "flex" : "none"; } }

// 封面核对：封面图本身变了才更新（播放器常常先换歌名、后换封面）；唱片中心等换片动画结束再同步
let artSeen = "";
function syncArt(){
  let id = ""; try { id = H.artId(); } catch(e) { return; }
  if (id === artSeen) return;
  const a = H.art(); artSeen = id;
  const c = $("cover"), lab = $("lab"); if (!c) return;
  const u = a ? `url("${a}")` : "";
  c.style.backgroundImage = u; c.classList.toggle("has", !!a);
  if (!swapping && lab) lab.style.backgroundImage = u;
}
function poll(){
  syncArt();
  if (Date.now() < holdUntil) return;
  try { S = JSON.parse(H.now()); } catch(e) { S = { has:false }; }
  if (S.has) clk.feed(S);
  render(); tick();
}
function tick(){
  const c = $("clock"), d = new Date();
  c.textContent = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  const dt = $("date");
  if (dt) dt.textContent = (d.getMonth()+1) + "月" + d.getDate() + "日 周" + ["日","一","二","三","四","五","六"][d.getDay()];
  if (!built || !S.has) return;
  const ms = clk.now(), sec = Math.floor(ms / 1000);
  if (!dragging && sec !== lastSec) { lastSec = sec; paintProg(ms); }   // 进度条一秒只画一次
  if (!lines.length) return;
  const i = Lyric.index(lines, ms + 200);   // 提前 0.2 秒换行，看着更跟拍
  if (i === cur) return;
  const box = $("lines"); const old = box.querySelector(".ln.on"); if (old) old.classList.remove("on");
  cur = i;
  const el = box.children[Math.max(0, i)];
  if (i >= 0 && el) el.classList.add("on");
  if (el) { const h = $("lyr").clientHeight; box.style.transform = `translateY(${Math.round(h * 0.5 - el.offsetTop - el.offsetHeight / 2)}px)`; }
}
function paintProg(ms){
  const p = S.duration ? Math.min(1, ms / S.duration) : 0;
  $("fill").style.width = (p * 100) + "%"; $("knob").style.left = (p * 100) + "%";
  $("tpos").textContent = Lyric.mmss(ms);
  const dk = $("deck"); if (dk) dk.style.setProperty("--arm", (11 + 20 * p).toFixed(2) + "deg");   // 唱臂跟着进度往里走
}
// 电量（播放页也藏了系统状态栏，所以自己画一个，和桌面同一套样式）
function battery(){
  let b; try { b = JSON.parse(H.battery()); } catch(e) { return; }
  const el = $("batt"); if (!el || b.level == null || b.level < 0) return;
  el.className = "batt" + (b.charging ? " chg" : b.level <= 20 ? " low" : "");
  el.innerHTML = `<span class="bcell"><i style="width:${b.level}%"></i></span>` +
    (b.charging ? `<svg viewBox="0 0 10 12"><path d="M6 0 1 7h3l-1 5 5-7H5z" fill="#2f9e4a"/></svg>` : "") + b.level + "%";
}

window.pl = {
  step(k){ step(k); },
  lyrics(id, lrc){
    if (id !== key) return;
    cur = -2;
    const synced = Lyric.parse(lrc).filter((l) => l.text);
    if (live && !synced.length) return;          // 没有整篇时间轴：继续用 QQ 音乐实时给的那句
    if (synced.length) live = null;
    lines = Lyric.parse(lrc).filter((l) => l.text);
    if (!lines.length) { lmsg("这首歌没有歌词 · 听歌吧"); return; }
    lmsg("");
    $("lines").innerHTML = lines.map((l, i) => `<div class="ln" data-i="${i}"><span>${esc(l.text)}</span></div>`).join("");
    tick();
  },
  pause(){ clearInterval(tPoll); clearInterval(tTick); clearInterval(tBatt); tPoll = tTick = tBatt = 0; hidden = true; paintSpin(); },
  resume(){ pl.pause(); hidden = false; poll(); battery(); tPoll = setInterval(poll, 500); tTick = setInterval(tick, 250); tBatt = setInterval(battery, 30000); }   // 0.5 秒问一次：跟得上车载歌词换行
};

// 拖进度条
function bindProg(){
  const p = $("prog");
  const at = (e) => { const r = p.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (S.duration || 0); };
  p.addEventListener("pointerdown", (e) => { if (!S.duration) return; dragging = true; p.setPointerCapture(e.pointerId); paintProg(at(e)); });
  p.addEventListener("pointermove", (e) => { if (dragging) paintProg(at(e)); });
  const up = (e) => { if (!dragging) return; dragging = false; const ms = Math.round(at(e)); seek(ms); };
  p.addEventListener("pointerup", up); p.addEventListener("pointercancel", () => { dragging = false; });
}
function seek(ms){ H.control("seek:" + ms); clk.set(ms); holdUntil = Date.now() + 1200; cur = -2; lastSec = -1; tick(); }

// 点击
document.addEventListener("pointerdown", (e) => { const t = e.target.closest("[data-k],.b,.mi"); if (t) t.classList.add("down"); });
document.addEventListener("pointercancel", () => document.querySelectorAll(".down").forEach((x) => x.classList.remove("down")));
document.addEventListener("pointerup", (e) => {
  document.querySelectorAll(".down").forEach((x) => x.classList.remove("down"));
  const ln = e.target.closest(".ln");
  if (ln && lines[+ln.dataset.i]) { seek(lines[+ln.dataset.i].t); return; }   // 点哪句跳到哪句
  const t = e.target.closest("[data-k]"); if (!t) return;
  const k = t.dataset.k;
  if (k === "app") H.openApp();
  else if (k === "playpause") { S.playing = !S.playing; clk.playing = S.playing; holdUntil = Date.now() + 1500; render(); H.control("playpause"); }
  else if (k === "prev" || k === "next") step(k);
});
</script>
<script>pl.resume();</script>
</body></html>
