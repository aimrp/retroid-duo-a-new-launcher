<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STOP · The Stompers · 下屏</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script src="js/i18n.js"></script><script src="js/engine.js"></script><script src="js/art.js"></script><script src="js/art_end.js"></script><script src="js/bypass.js"></script><script src="js/link.js"></script>
<script src="js/bottom.js"></script>
<script>
// 开发页里焦点落在下屏时，把键盘转给上屏
if (window.parent !== window) ['keydown','keyup'].forEach(t => addEventListener(t, e => { parent.postMessage({ sh: 'key', code: e.code, down: t === 'keydown' }, '*'); e.preventDefault(); }));
</script>
</body></html>
